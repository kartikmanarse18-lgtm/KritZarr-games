function satTile(z,x,y){const k="s"+z+"/"+x+"/"+y;if(!TC[k]){const i=new Image();i.src="https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/"+z+"/"+y+"/"+x;TC[k]=i}return TC[k]}

const bc=()=>{const s=S.st,t=Date.now();S.net.emit("state",{...s,tl:s.endsAt-t,nl:s.nextPing-t,h2:C.h2&&s.phase==="live"&&t>=s.endsAt-s.hunt*500?C.h2:""})};
function ping(){const o={};S.net.peers().forEach(p=>{const q=p.presence;if(!q||q.role!=="H")return;if(S.jamNext){o[q.n]={h:-2,t:"📵 Signal jammed by the Courier"};return}if(q.lat==null){o[q.n]={h:-1,t:"No position yet"};return}
  const tg=tgt(q.n);if(!tg){o[q.n]={h:-1,t:S.st.mode==="trail"?"Trail complete":"No target"};return}const d=dist(q,tg),b=band(d),pv=C.prev[q.n];o[q.n]={h:b[1],t:b[2],tr:pv==null?0:d<pv-5?1:d>pv+5?-1:0};C.prev[q.n]=d});
  S.jamNext=false;S.radar=o;S.radarAt=Date.now();S.net.emit("radar",o)}
function launch(clue,iv,hunt){const s=S.st;C.tries={};C.prev={};Object.assign(s,{phase:"live",round:s.round+1,clue,interval:iv,hunt,endsAt:Date.now()+hunt*1000,nextPing:Date.now()+iv*1000,note:""});S.msg="";S.hist=[];S.son=1;ping();bc()}
function secure(){const s=S.st;s.secured++;s.note="Drop #"+s.round+" secured. The hunters ran out of time.";s.log=(s.log||[]).concat("Drop #"+s.round+": secured ✅");s.phase=s.secured>=3?"won":"hiding";bc()}
function onClaim(d){const s=S.st;if(s.paused)return S.net.emit("result",{n:d.n,ok:false,m:"Hunt is paused."},d.n);if(s.phase==="trail")return tClaim(d);if(s.phase!=="live")return;const n=d.n;C.tries[n]=C.tries[n]||0;
  if(C.tries[n]>=3)return S.net.emit("result",{n,ok:false,left:0});
  if(String(d.code)===C.pass){s.phase="caught";s.note=n+" recovered the payload.";s.log=(s.log||[]).concat("Drop #"+s.round+": intercepted by "+n+" ❌");S.net.emit("result",{n,ok:true});bc()}
  else{C.tries[n]++;S.net.emit("result",{n,ok:false,left:3-C.tries[n]})}}
function onScan(d){const q=S.net.peers().map(p=>p.presence).find(p=>p&&p.n===d.n);if(!q||q.lat==null)return;S.alert="👁 "+d.n+" used sonar on you!";toast(S.alert);buzz();setTimeout(()=>S.alert="",8000);S.net.emit("sonar",{n:d.n,m:+(Math.round(dist(q,tgt(d.n)||C.drop)/rs())*rs()).toFixed(1)})}
function board(){S.st.board=Object.entries(T.prog).map(([n,p])=>({n,i:p.i,pts:p.pts,done:p.done?1:0,f:p.fin||0})).sort((a,b)=>(b.done-a.done)||(a.done&&b.done?a.f-b.f:0)||(b.i-a.i)||(b.pts-a.pts))}
function tSend(n){const p=T.prog[n];if(!p)return;const st=T.stops[Math.min(p.i,T.stops.length-1)];
  S.net.emit("stop",{n,i:p.i,total:T.stops.length,clue:p.done?"You found the treasure! 🏆":st.clue,hint:p.hint&&!p.done?st.hint:"",hq:!!st.hint&&!p.done,pin:(!p.done&&st.rv)?{lat:st.lat,lng:st.lng}:null,pts:p.pts,done:!!p.done},n)}
function tLaunch(iv,lim){const s=S.st,t=Date.now();T.prog={};C.prev={};T.start=t;S.jamNext=false;
  Object.assign(s,{mode:"trail",phase:"trail",round:1,total:T.stops.length,interval:iv,endsAt:t+lim*1000,nextPing:t+iv*1000,note:"",board:[]});bc()}
function tClaim(d){const s=S.st,n=d.n,p=T.prog[n],t=Date.now();if(!p||p.done||s.phase!=="trail")return;
  const R=(ok,m)=>S.net.emit("result",{n,ok,m,left:0},n);
  if(p.lock>t)return R(false,"Locked for "+Math.ceil((p.lock-t)/1000)+" s after wrong codes.");

function tickT(t){const s=S.st;

    <div class="card"><h2>Trail</h2><div class="mut">${T.stops.map((p,i)=>(i+1)+". "+esc(p.clue)+" · code <b>"+esc(p.code)+"</b>").join("<br>")}</div></div>

  else if(s.phase==="trail"){h+=`<div class="card"><h2 id="stp">Waiting for your first clue…</h2><div id="sc"></div><div id="th" class="mut" style="margin-top:8px"></div><button class="g" id="hb" data-a="hint">💡 Reveal hint (−30 pts)</button></div>
    <div class="card"><div class="mut">Time left</div><div class="big" id="tm"></div><h2>📡 Radar</h2><div class="gz" id="gz"></div><div id="rt"></div><div class="mut">Heat history</div><div id="hs" class="gz" style="height:34px;align-items:flex-end"></div><div class="mut">Next ping in <b id="np"></b></div></div>
    <div class="card"><h2>Enter this stop’s code</h2><div class="mut">Get within 60 m, find the marker, read its 4-digit code.</div><input id="cc" maxlength="4" inputmode="numeric" placeholder="••••"><button data-a="claim">Submit code</button><button class="g" id="sb" data-a="sonar"></button><div id="ms" class="err"></div><div id="pi" class="mut"></div></div>
    <div class="card"><h2>🏁 Leaderboard</h2><div id="lb" class="mut"></div></div>`+mapc()}
  else if(S.role==="C"&&s.phase==="hiding"&&S.gm==="trail"){h+=`<div class="card"><div class="row"><button class="g" data-a="gm" data-m="drop">Dead Drop</button><button data-a="gm" data-m="trail">Treasure Trail</button></div>
    <h2>Build the trail · ${T.stops.length} stop(s)</h2><div class="mut">Walk to each hiding spot, leave a marker with a 4-digit code, and mark it here. Each code unlocks the clue to the next stop. The last stop is the 🏆 treasure.</div>
    <div class="mut">${T.stops.map((p,i)=>(i+1)+". "+esc(p.clue)+" · code "+esc(p.code)).join("<br>")}</div><div id="pi" class="mut"></div>
    <label class="mut">Clue that leads hunters TO stop ${T.stops.length+1}</label><textarea id="tc" rows="2" maxlength="160" placeholder="Where the river bends beneath the iron arch…"></textarea>
    <label class="mut">4-digit code at this stop</label><input id="tk" maxlength="4" inputmode="numeric" value="${1000+Math.floor(Math.random()*9000)}">
    <label class="mut">Hint (optional, costs hunters 30 pts)</label><input id="tt" maxlength="100">
    <label class="mut"><input id="tr" type="checkbox" style="width:auto;margin-right:6px">Show this stop’s pin on hunters’ maps once they clear the previous stop</label><button data-a="addstop">📍 Mark this spot as stop ${T.stops.length+1}</button>${T.stops.length?'<button class="g" data-a="popstop">Remove last stop</button>':""}
    <div class="row"><div><label class="mut">Radar ping</label><select id="iv"><option value="120">Every 2 min</option><option value="60">Every 1 min</option><option value="30">Every 30 s</option><option value="15">Every 15 s</option></select></div><div><label class="mut">Time limit</label><select id="lm"><option value="60">60 min</option><option value="30">30 min</option><option value="15">15 min</option><option value="5">5 min</option></select></div></div>
    <div id="er" class="err"></div><div id="hn" class="mut"></div>${S.mode==="room"?`<div class="mut">Room code · hunters can join any time</div><div class="big" style="letter-spacing:6px">${esc(S.code)}</div><button class="g" data-a="sharelink">📨 Share invite link</button>`:""}
    <button data-a="starttrail">🏁 Start the hunt</button></div>`+mapc()}
  else if(s.phase==="won"||s.phase==="caught"){const cw=s.phase==="won";
    h+=`<div class="card"><h2>${cw?"🎒 Courier wins":"🔍 Hunters win"}</h2><div>${esc(s.note)}</div><div class="mut">${cw?"Three clean drops in a row.":"Payload intercepted on drop #"+s.round+"."}</div><h2 style="margin-top:12px">Mission log</h2><div class="mut">${(s.log||[]).map(esc).join("<br>")}</div>${S.role==="C"&&S.mode==="room"?'<button data-a="rematch">🔁 Rematch in this room</button>':""}<button class="g" data-a="again">Back to HQ</button></div>`}
  else if(S.role==="C"&&s.phase==="hiding"){
    h+=`<div class="card">${s.round===0&&S.mode==="room"?`<div class="row"><button data-a="gm" data-m="drop">Dead Drop</button><button class="g" data-a="gm" data-m="trail">Treasure Trail</button></div>`:""}<h2>Drop #${s.secured+1}: hide the token</h2><div class="mut">${esc(s.note)}</div>
    <div class="mut">Go to your hiding spot, hide the token, then lock in the drop.</div><div id="pi" class="mut"></div><div id="hn" class="mut"></div>${S.mode==="room"?`<div class="mut">Room code · hunters can join any time, from anywhere</div><div class="big" style="letter-spacing:6px">${esc(S.code)}</div><button class="g" data-a="sharelink">📨 Share invite link</button>`:""}
    <label class="mut">Cryptic clue for hunters</label><textarea id="cl" rows="3" maxlength="200" placeholder="Where shadows meet the old oak…"></textarea><label class="mut">Bonus hint (unlocks at half time, optional)</label><input id="h2" maxlength="120" placeholder="Three paces from something metal">
    <label class="mut">4-digit code (write it on the token)</label><input id="pc" maxlength="4" inputmode="numeric" value="${1000+Math.floor(Math.random()*9000)}">
    <div class="row"><div><label class="mut">Radar ping</label><select id="iv"><option value="120">Every 2 min</option><option value="60">Every 1 min</option><option value="30">Every 30 s</option><option value="15">Every 15 s</option></select></div>
    <div><label class="mut">Hunt time</label><select id="hu"><option value="600">10 min</option><option value="300">5 min</option><option value="180">3 min</option><option value="90">90 s</option></select></div></div>
    <div id="er" class="err"></div><button data-a="lock">🔒 Lock in dead drop</button></div>`+mapc()}
  else if(S.role==="C"){
    h+=`<div class="card"><h2>Drop #${s.round} is live</h2><div class="mut">Hunt ends in</div><div class="big" id="tm"></div><div class="mut">Next radar ping in <b id="np"></b> · code <b>${esc(C.pass)}</b>${S.mode==="room"?" · room <b>"+esc(S.code)+"</b>":""}</div></div>
    <div class="card"><h2>Hunters</h2><div id="hl" class="mut">Waiting for hunters to join…</div></div><div class="card"><button id="jb" data-a="jam"></button><button class="g" data-a="bcast">📣 Message hunters</button><button class="g" id="pb" data-a="pause"></button><button class="g" data-a="endnow">⏹ End hunt early</button><div id="al" class="err"></div><div id="ms" class="mut"></div></div>`+mapc()}
  else if(s.phase==="hiding"){
    h+=`<div class="card"><h2>Standing by</h2><div class="mut">${esc(s.note)||"The Courier is hiding the token…"}</div>${S.mode==="room"?'<button id="rb" data-a="ready"></button>':""}<div id="pi" class="mut"></div></div>`+mapc()}
  else{
    h+=`<div class="card"><h2>🗝 Clue · drop #${s.round}</h2><div>${esc(s.clue)}</div><div id="hh" class="mut" style="margin-top:8px"></div></div>
    <div class="card"><div class="mut">Time left</div><div class="big" id="tm"></div><h2>📡 Radar</h2><div class="gz" id="gz"></div><div id="rt"></div><div class="mut">Heat history</div><div id="hs" class="gz" style="height:34px;align-items:flex-end"></div><div class="mut">Next ping in <b id="np"></b></div></div>
    <div class="card"><h2>Claim the payload</h2><div class="mut">Enter the 4-digit code on the token.</div><input id="cc" maxlength="4" inputmode="numeric" placeholder="••••"><button data-a="claim">Submit code</button><button class="g" id="sb" data-a="sonar"></button><div id="ms" class="err"></div><div id="pi" class="mut"></div></div>`+mapc()}
  a.innerHTML=h}
function dyn(){const s=S.st,t=Date.now(),g=i=>$(i);
  document.body.dataset.r=S.role||"";document.body.dataset.ph=s.phase;
  {const e=g("ts");e.textContent=S.toast||"";e.classList.toggle("on",!!S.toast&&t<S.toastT)}
  if(g("pb"))g("pb").textContent=s.paused?"▶ Resume hunt":"⏸ Pause hunt";if(g("rb"))g("rb").textContent=S.ready?"✅ Ready (tap to undo)":"✋ I’m ready";drawRM(g("rm"));drawHM(g("hm"));
  if(g("cst"))g("cst").textContent=S.cerr||"Contacting the Courier…";
  if(g("lb"))g("lb").innerHTML=(s.board||[]).map((r,k)=>`<div class="lr"><i>${["🥇","🥈","🥉"][k]||k+1}</i><b>${esc(r.n)}${r.n===S.name?" (you)":""}</b><span>${r.done?"🏆 finished":"stop "+Math.min(r.i+1,s.total)+"/"+s.total} · ${r.pts} pts${S.role==="C"&&S.radar[r.n]?"<br>"+esc(S.radar[r.n].t):""}</span></div>`).join("")||"No hunters yet.";
  if(g("stp")){const k=S.stop;g("stp").textContent=k?(k.done?"🏆 Treasure found!":"🗝 Stop "+(k.i+1)+" of "+k.total+" · "+k.pts+" pts"):"Waiting for your first clue…";g("sc").textContent=k?k.clue:"";g("th").textContent=k&&k.hint?"💡 "+k.hint:"";g("hb").style.display=k&&k.hq&&!k.hint?"":"none"}
  if(g("tm")){g("tm").textContent=mmss(s.endsAt-t);g("tm").classList.toggle("low",s.endsAt-t<30000&&!s.paused)}if(g("np"))g("np").textContent=mmss(s.nextPing-t);
  if(g("ms"))g("ms").textContent=S.msg;
  if(g("cs"))g("cs").textContent=s.paused?"⏸ Hunt paused by the Courier":S.role==="H"&&S.seen&&t-S.seen>12000?"⚠ Courier signal lost…":"";
  if(g("hh"))g("hh").textContent=s.h2?"💡 Bonus hint: "+s.h2:"💡 Bonus hint unlocks at half time.";
  if(g("sb")){g("sb").textContent="🎯 Sonar burst · "+S.son+" left (alerts Courier)";g("sb").disabled=S.son<1}
  if(g("jb")){g("jb").textContent="📵 Jam next radar ping ("+S.jam+" left)"+(S.jamNext?" · armed":"");g("jb").disabled=S.jam<1&&!S.jamNext}
  if(g("al"))g("al").textContent=S.alert||"";
  if(g("hs"))g("hs").innerHTML=S.hist.map(h=>`<span class="on" style="height:${(h+1)*16}%;background:var(--acc)"></span>`).join("");
  if(g("hn")){const hs=S.net.peers().filter(p=>p.presence&&p.presence.role==="H");g("hn").textContent="Hunters in room: "+hs.length+" · ready: "+hs.filter(p=>p.presence.r).length};
  if(g("pi"))g("pi").textContent=S.hm?(S.pos?"Position set. Tap the map to move.":"Tap the map where you are standing."):S.pos?"GPS lock: "+S.pos.lat.toFixed(5)+", "+S.pos.lng.toFixed(5)+" (±"+Math.round(S.acc||0)+" m)":"Waiting for GPS… "+(S.gerr||"allow location access.");
  if(g("hl")){const e=Object.entries(S.radar);g("hl").innerHTML=e.length?e.map(([n,r])=>`<div class="lr"><b>${esc(n)}</b><span>${esc(r.t)}</span></div>`).join(""):"No hunters detected yet."}
  if(g("gz")){const r=S.radar[S.name];const h=r?r.h:-1;if(g("gz").dataset.h!=h){g("gz").dataset.h=h;g("gz").innerHTML=scope(h)}
    g("rt").innerHTML=r?`<b>${esc(r.t)}</b> ${r.tr>0?"↗ warmer":r.tr<0?"↘ colder":""}<div class="mut">Updated ${Math.round((t-S.radarAt)/1000)} s ago</div>`:'<div class="mut">Awaiting first ping…</div>'}
  }

/* ---------- actions ---------- */
async function start(a){const nm=$("nm").value.trim(),er=$("er"),pub=$("pu")&&$("pu").checked;
  if(!nm){er.textContent="Pick a codename.";return}
  const cd=$("cd").value.trim().toUpperCase();
  if(a==="join"&&!/^[A-Z0-9]{5}$/.test(cd)){er.textContent="Enter the 5-character room code.";return}
  if(typeof Peer==="undefined"){er.textContent="Networking library failed to load. Reload the page.";return}
  S.name=nm;try{localStorage.setItem("pp_n",nm)}catch(e){}wake();
    if(a==="host"){er.textContent="Opening room…";let net=null;
    for(let i=0;i<3&&!net;i++){const n=courierNet(genCode());try{await n.ready;net=n}catch(e){n.close();if(e&&e.type!=="unavailable-id"){er.textContent="Could not reach the matchmaking service ("+((e&&e.type)||"offline")+"). Check your connection.";return}}}
    if(!net){er.textContent="Could not open a room. Try again.";return}
    S.mode="room";S.role="C";S.net=net;S.code=net.code;S.pub=pub}
  else{S.mode="room";S.role="H";S.name=nm+"-"+(10+Math.floor(Math.random()*90));S.code=cd;S.net=hunterNet(cd);S.pair=true}
  gps();wire();pres();view()}
document.addEventListener("click",async e=>{const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a;
  if(a==="tut")return openTut(0);
  if(a==="tnext")return openTut(S.ti+1);
  if(a==="tprev")return openTut(S.ti-1);
  if(a==="tclose"){$("tut").hidden=true;return}
  if(a==="tdemo")return demo(+b.dataset.h);
  if(a==="nearby")return nearby();
  if(a==="joincode"){$("cd").value=b.dataset.c;return start("join")}
  if(["host","join"].includes(a))return start(a);
  if(a==="again")return location.reload();
  if(a==="usehome"||a==="usegrid"){const w=Math.max(3,Math.min(2000,+$("mw").value||60)),f=a==="usehome"&&$("mf").files[0];
    if(a==="usehome"&&!f)return toast("Choose a floor plan image first.");
    const go=(src,ar)=>{M.id=Date.now();M.sat=null;M.w=w;M.a=ar;M.labels=[];M.parts=[];M.im=null;if(src){M.im=new Image;M.im.src=src;for(let i=0;i<src.length;i+=8000)M.parts.push(src.slice(i,i+8000))}M.ok=1;S.hm=1;S.st.hm=1;S.pos={lat:.5*w*ar*K,lng:.5*w*K};S.acc=0;bc();sendMap();view()};
    if(!f)return go(null,.75);const im=new Image;im.onload=()=>{const sc=Math.min(1,1000/Math.max(im.width,im.height)),W=Math.round(im.width*sc),H=Math.round(im.height*sc),c=document.createElement("canvas");c.width=W;c.height=H;c.getContext("2d").drawImage(im,0,0,W,H);go(c.toDataURL("image/jpeg",.6),H/W)};im.onerror=()=>toast("Could not read that image.");im.src=URL.createObjectURL(f);return}
  if(a==="usesat"){if(!S.geo)return toast("Waiting for GPS. Allow location access and try again.");const r=Math.max(30,Math.min(20000,+$("sx").value||+$("sr").value));M.id=Date.now();M.sat={lat:S.geo.lat,lng:S.geo.lng,r};M.w=2*r;M.a=1;M.labels=[];M.parts=[];M.im=null;M.ok=1;S.hm=1;S.st.hm=1;S.pos={lat:r*K,lng:r*K};S.acc=0;bc();sendMeta();view();return}
  if(a==="usegps"){S.hm=0;S.st.hm=0;S.pos=null;bc();view();return}
  if(a==="mlabel"){if(!S.pos)return;const t=(prompt("Name this spot (e.g. Kitchen)")||"").trim().slice(0,16);if(t){M.labels.push({t,u:S.pos.lng/K/M.w,v:S.pos.lat/K/(M.w*M.a)});sendMeta()}return}
  if(a==="mlabclr"){M.labels=[];sendMeta();return}
  if(a==="pause"){S.st.paused=!S.st.paused;bc();return}
  if(a==="ready"){S.ready=!S.ready;pres();return}
  if(a==="rematch"){Object.assign(S.st,{phase:"hiding",round:0,secured:0,clue:"",note:"New game. The Courier is setting up.",log:[],board:[],mode:undefined,paused:false,total:0});S.gm=undefined;T.stops=[];T.prog={};C.drop=null;S.jam=1;S.jamNext=false;S.radar={};bc();view();return}
  if(a==="leave"){if(confirm("Leave this game?"))location.reload();return}
  if(a==="mute"){S.mute=!S.mute;try{localStorage.setItem("pp_m",S.mute?"1":"0")}catch(x){}b.textContent=S.mute?"🔇":"🔊";return}
  if(a==="bcast"){const m=(prompt("Message to all hunters:")||"").trim().slice(0,120);if(m&&S.net)S.net.emit("bcast",{m});return}
  if(a==="endnow"){if(!confirm("End this hunt now?"))return;const s=S.st;if(s.phase==="trail")s.endsAt=Date.now();else{s.phase="hiding";s.note="Drop aborted by the Courier.";s.log=(s.log||[]).concat("Drop #"+s.round+": aborted");bc()}return}
  if(a==="sharelink"){const u=location.origin+location.pathname+"?join="+S.code,t="Join my Phantom Post game! Room code "+S.code+" · "+u;try{if(navigator.share)await navigator.share({text:t});else{await navigator.clipboard.writeText(t);$("er").textContent="Invite copied."}}catch(x){}return}
  if(a==="gm"){S.gm=b.dataset.m;view();return}
  if(a==="addstop"){const cl=$("tc").value.trim(),cd=$("tk").value.trim(),ht=$("tt").value.trim(),er=$("er");
    if(!S.pos)return er.textContent="No position yet. Wait for GPS, or tap the map to place a pin.";if(!cl)return er.textContent="Write the clue for this stop.";
    if(!/^\d{4}$/.test(cd))return er.textContent="Code must be 4 digits.";if(T.stops.length>=8)return er.textContent="Maximum 8 stops.";
    T.stops.push({lat:S.pos.lat,lng:S.pos.lng,clue:cl,code:cd,hint:ht,rv:$("tr").checked});view();return}
  if(a==="popstop"){T.stops.pop();view();return}
  if(a==="starttrail"){if(!rdy())return;const er=$("er");if(T.stops.length<2)return er.textContent="Add at least 2 stops (the last one is the treasure).";tLaunch(+$("iv").value,+$("lm").value*60);view();return}
  if(a==="hint"){S.net.emit("hint",{n:S.name});return}
  if(a==="jam"){if(S.jam>0&&(S.st.phase==="live"||S.st.phase==="trail")){S.jam--;S.jamNext=true;S.msg="Jammer armed for the next ping."}return}
  if(a==="sonar"){if(S.son>0&&(S.st.phase==="live"||S.st.phase==="trail")){S.son--;S.net.emit("scan",{n:S.name});S.msg="Sonar sent…"}return}
  if(a==="lock"){if(!rdy())return;const cl=$("cl").value.trim(),pc=$("pc").value.trim(),er=$("er");if(S.mode==="room"&&!S.net.peers().length)return er.textContent="No hunters have joined yet. Share the room code.";
    if(!S.pos)return er.textContent="No position yet. Wait for GPS, or tap the map to place a pin.";
    if(!cl)return er.textContent="Write a clue.";if(!/^\d{4}$/.test(pc))return er.textContent="Code must be 4 digits.";
    C.drop={...S.pos};C.pass=pc;C.h2=$("h2").value.trim();launch(cl,+$("iv").value,+$("hu").value);view()}
  if(a==="claim"){const v=$("cc").value.trim();if(v.length!==4)return S.msg="Enter the 4-digit code.";S.msg="Code sent…";S.net.emit("claim",{n:S.name,code:v});setTimeout(()=>{if(S.msg==="Code sent…")S.msg=""},4000)}
  });
document.addEventListener("pointerdown",e=>{if(e.target.id!=="hm")return;const r=e.target.getBoundingClientRect(),u=(e.clientX-r.left)/r.width,v=(e.clientY-r.top)/r.height;S.pos={lat:v*M.w*M.a*K,lng:u*M.w*K};S.acc=0;pres()});
setInterval(()=>{if(S.pub&&!S.dir&&S.geo&&!S.dirTry){S.dirTry=1;openDir()}const t0=Date.now();if(S.st.paused&&(S.st.phase==="live"||S.st.phase==="trail")){const d=t0-(S.lt||t0);S.st.endsAt+=d;S.st.nextPing+=d}S.lt=t0;{const ph=S.st.phase;if(ph==="won"||ph==="caught"||ph==="trailend"){if(!S.rec&&S.mode==="room"){S.rec=1;rec(ph)}if(!S.cel){S.cel=1;burst(ph==="won"?"🎒💜✨":"🏆🎉✨")}}else{S.rec=0;S.cel=0}}tickC();if(S.role==="H"&&!S.pair&&Date.now()-(S.pt||0)>5000){S.pt=Date.now();pres()}const k=keyOf();if(S.role&&k!==S.key)view();dyn()},500);
view();
try{if(!localStorage.getItem("pp_t"))openTut(0)}catch(e){}
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
</script></body></html>
