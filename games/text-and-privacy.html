function csvParse(t){const r=[];let row=[],c='',q=false;for(let i=0;i<t.length;i++){const ch=t[i];
if(q){if(ch=='"'&&t[i+1]=='"'){c+='"';i++}else if(ch=='"')q=false;else c+=ch}
else if(ch=='"')q=true;else if(ch==','){row.push(c);c=''}else if(ch=='\n'){row.push(c.replace(/\r$/,''));r.push(row);row=[];c=''}else c+=ch}
if(c||row.length){row.push(c);r.push(row)}return r}
const sortK=v=>Array.isArray(v)?v.map(sortK):v&&typeof v=='object'?Object.keys(v).sort().reduce((a,k)=>(a[k]=sortK(v[k]),a),{}):v;
const words=t=>t.replace(/([a-z])([A-Z])/g,'$1 $2').split(/[^A-Za-z0-9]+/).filter(Boolean);
const T={
JSON:{o:[{k:'m',l:'Mode',v:['Format','Minify','Validate','Sort keys']},{k:'i',l:'Indent',v:['2','4','Tab']}],
run:(t,o)=>{const j=JSON.parse(t),ind=o.i=='Tab'?'\t':+o.i;
return o.m=='Minify'?JSON.stringify(j):o.m=='Validate'?'Valid JSON ✓ ('+(Array.isArray(j)?j.length+' items':typeof j=='object'&&j?Object.keys(j).length+' keys':typeof j)+')':JSON.stringify(o.m=='Sort keys'?sortK(j):j,null,ind)}},
Slug:{o:[{k:'s',l:'Separator',v:['-','_','.']},{k:'x',l:'Max length (0 = none)',t:'0'}],
run:(t,o)=>t.split('\n').map(l=>{let s=l.normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/ß/g,'ss').toLowerCase().replace(/[^a-z0-9]+/g,o.s).replace(new RegExp('^\\'+o.s+'+|\\'+o.s+'+$','g'),'');

Protect:{o:[{k:'m',l:'Mode',v:['Encrypt','Decrypt']},{k:'p',l:'Passphrase',t:'',pw:1}],
run:async(t,o)=>{if(!o.p)throw Error('Enter a passphrase');

Encode:{o:[{k:'m',l:'Mode',v:['Base64 encode','Base64 decode','URL encode','URL decode','HTML escape','HTML unescape']}],
run:(t,o)=>({'Base64 encode':()=>b64(enc.encode(t)),'Base64 decode':()=>dec.decode(unb64(t)),'URL encode':()=>encodeURIComponent(t),'URL decode':()=>decodeURIComponent(t),

CSV:{o:[{k:'m',l:'Mode',v:['CSV → JSON','JSON → CSV']}],
run:(t,o)=>{if(o.m=='CSV → JSON'){const r=csvParse(t.trim()),h=r.shift();return JSON.stringify(r.map(x=>Object.fromEntries(h.map((k,i)=>[k,x[i]??''])))  ,null,2)}
const a=JSON.parse(t),h=[...new Set(a.flatMap(Object.keys))],q=v=>{v=v==null?'':typeof v=='object'?JSON.stringify(v):String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};

Text:{o:[{k:'m',l:'Mode',v:['Stats','UPPER','lower','Title Case','camelCase','snake_case','kebab-case','Sort lines','Unique lines','Reverse lines','Trim & collapse spaces']}],
run:(t,o)=>{const w=words(t),m=o.m;return m=='Stats'?`Characters: ${t.length}\nWords: ${(t.match(/\S+/g)||[]).length}\nLines: ${t?t.split('\n').length:0}\nReading time: ${Math.max(1,Math.round((t.match(/\S+/g)||[]).length/200))} min`
:m=='UPPER'?t.toUpperCase():m=='lower'?t.toLowerCase():m=='Title Case'?t.toLowerCase().replace(/\b\w/g,c=>c.toUpperCase())
:m=='camelCase'?w.map((x,i)=>i?x[0].toUpperCase()+x.slice(1).toLowerCase():x.toLowerCase()).join(''):m=='snake_case'?w.join('_').toLowerCase():m=='kebab-case'?w.join('-').toLowerCase()
:m=='Sort lines'?t.split('\n').sort((a,b)=>a.localeCompare(b)).join('\n'):m=='Unique lines'?[...new Set(t.split('\n'))].join('\n'):m=='Reverse lines'?t.split('\n').reverse().join('\n')
:t.split('\n').map(l=>l.trim().replace(/\s+/g,' ')).join('\n')}},
Regex:{o:[{k:'p',l:'Pattern',t:''},{k:'f',l:'Flags',t:'g'}],run:(t,o)=>{const f=o.f.includes('g')?o.f:o.f+'g',a=[...t.matchAll(new RegExp(o.p,f))];

Diff:{o:[],run:t=>{const [x,y]=t.split(/\n---\n/);if(y===undefined)throw Error('Put A, a line with ---, then B');const a=x.split('\n'),b=y.split('\n'),n=a.length,m=b.length,d=Array.from({length:n+1},()=>Array(m+1).fill(0));
for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)d[i][j]=a[i]==b[j]?d[i+1][j+1]+1:Math.max(d[i+1][j],d[i][j+1]);
const r=[];let i=0,j=0;while(i<n&&j<m){if(a[i]==b[j]){r.push('  '+a[i]);i++;j++}else if(d[i+1][j]>=d[i][j+1])r.push('- '+a[i++]);else r.push('+ '+b[j++])}
while(i<n)r.push('- '+a[i++]);while(j<m)r.push('+ '+b[j++]);return r.join('\n')}},
Generate:{o:[{k:'m',l:'Type',v:['UUID v4','Password','Lorem ipsum','Random numbers']},{k:'n',l:'Count / length',t:'16'}],run:(t,o)=>{const n=Math.min(+o.n||1,1000);
if(o.m=='UUID v4')return Array.from({length:Math.min(n,100)},()=>crypto.randomUUID()).join('\n');

JWT:{o:[],run:t=>{const p=t.trim().split('.');if(p.length<2)throw Error('Not a JWT');const u=s=>JSON.parse(dec.decode(unb64(s.replace(/-/g,'+').replace(/_/g,'/'))));const h=u(p[0]),b=u(p[1]);

Time:{o:[],run:t=>{t=t.trim();let ms;if(!t)ms=Date.now();else if(/^-?\d+$/.test(t))ms=t.length>11?+t:+t*1000;else{ms=Date.parse(t);if(isNaN(ms))throw Error('Enter a Unix timestamp or a date')}

Color:{o:[],run:t=>{t=t.trim();let r,g,b,m;
if(m=t.match(/^#?([0-9a-f]{3}|[0-9a-f]{6})$/i)){let h=m[1];if(h.length==3)h=[...h].map(c=>c+c).join('');[r,g,b]=[0,2,4].map(i=>parseInt(h.substr(i,2),16))}

};

<h3>About</h3><p style="font-size:.9rem">Universal Toolkit is a free, single-file app that bundles 24 everyday text, developer, PDF, image and spreadsheet tools. Text tools run fully on your device and offline. File tools also run on your device (your files are never uploaded), but they load helper libraries (pdf-lib, pdf.js, SheetJS, Tesseract.js) from a public CDN, so you need internet once per session, and OCR also downloads language data.</p>
<h3>Quick manual</h3><ul>
<li><b>Basics:</b> pick a tool card, set options, type or paste input. Results update live. Use Example to see sample data, Copy or Save to keep results, and Ctrl+Enter to run. Press / to search.</li>
<li><b>JSON / CSV / Text / Encode / Hash / Regex / Diff / JWT / Time / Color / Generate / Slug:</b> paste input, choose a mode. For Diff, put A, then a line with ---, then B.</li>
<li><b>Protect:</b> encrypts text with a passphrase (AES-256-GCM). Keep the passphrase safe: it cannot be recovered.</li>
<li><b>PDF Merge:</b> choose 2 or more PDFs (selected order is kept), press Run, and the merged file downloads.</li>
<li><b>PDF Pages:</b> choose one PDF, pick Extract, Delete or Rotate, and enter pages like 1-3,5,8-.</li>
<li><b>Img→PDF:</b> choose images (JPG, PNG, WebP), pick page size, press Run.</li>
<li><b>PDF→Text:</b> extracts the text layer. For scanned PDFs use OCR.</li>
<li><b>OCR:</b> choose images or a scanned PDF (first 20 pages), pick the language, press Run. Clear, straight, high-contrast print works best. Handwriting is weak.</li>
<li><b>Categories:</b> pick PDF, Images, Sheets, Security, Developer or Text at the top. Each shows only its own tools.</li>
<li><b>PDF Compress:</b> rebuilds pages as images at High, Medium or Low quality. Smaller files, but text is no longer selectable.</li>
<li><b>PDF Protect:</b> sets an open password and permissions. Keep the password safe: it cannot be recovered.</li>
<li><b>PDF Sign:</b> draw your signature, choose page and position, press Run. This is a visual signature, not a legally certified digital signature.</li>
<li><b>PDF Redact:</b> type words to hide (one per line) and choose a PDF. Matching text is blacked out and pages become images, so the text is truly removed. Always review the result, since phrases split across lines can be missed.</li>
<li><b>PDF Annotate:</b> add text, a watermark or page numbers. Latin letters only.</li>
<li><b>Excel:</b> read XLSX/XLS/CSV/ODS as JSON, CSV or a preview, or paste JSON/CSV text and create an XLSX.</li></ul>
<h3>How it compares</h3><p style="font-size:.8rem;color:var(--mut)">A general comparison from common knowledge, not a live check. Products change, so verify current features and pricing.</p>
<div class="t"><table><tr><th>Feature</th><th>This toolkit</th><th>Online PDF sites (e.g. Smallpdf, iLovePDF)</th><th>Desktop suites (e.g. Adobe Acrobat, Foxit)</th></tr>
<tr><td>Cost</td><td>Free, no limits</td><td>Free tier with caps, paid plans</td><td>Paid subscription or licence</td></tr>
<tr><td>Privacy</td><td>Files stay on your device</td><td>Files are uploaded to servers</td><td>Local, with optional cloud</td></tr>
<tr><td>Merge, split, rotate, images to PDF</td><td>Yes</td><td>Yes</td><td>Yes</td></tr>
<tr><td>OCR</td><td>Yes (Tesseract, good on clean print)</td><td>Often paid</td><td>Yes, usually most accurate</td></tr>
<tr><td>Password-protect, sign, redact, compress PDFs</td><td>Yes (basic, see limits)</td><td>Yes</td><td>Yes</td></tr><tr><td>Edit existing PDF text</td><td>No. Add text, watermark, page numbers instead</td><td>Some</td><td>Yes</td></tr>
<tr><td>Spreadsheet conversion</td><td>Basic read and create</td><td>Some</td><td>Full in Excel</td></tr>
<tr><td>Developer tools (JSON, regex, JWT, hashes)</td><td>Built in</td><td>No</td><td>No</td></tr>
<tr><td>Offline</td><td>Text tools yes, file tools need internet once per session</td><td>No</td><td>Yes</td></tr></table></div>
<h3>Known limits</h3><ul><li>Encrypted PDFs may not open in PDF tools. Real editing of existing PDF text is not possible in a browser app like this.</li><li>Very large files can be slow on phones.</li><li>JWT decoding does not verify signatures.</li></ul>`;
