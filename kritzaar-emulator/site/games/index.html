<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Game Catalog | KritZaar</title>
<meta name="description" content="Browse classic PC games that are free or legally available. Get each one from its official page, then play it right in your browser on KritZaar.">
<link rel="canonical" href="https://kritzaar.com/games/">
<meta name="theme-color" content="#7c5cff">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="stylesheet" href="/css/emulator-shared.css">
<link rel="stylesheet" href="/css/catalog.css">
<style>
  body{margin:0;background:var(--kz-bg,#0f1020);color:var(--kz-text,#f1f0fa);font-family:var(--kz-font,system-ui,sans-serif);line-height:1.5;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  .kz-cat-page{box-sizing:border-box;max-width:960px;margin:0 auto;padding:12px 16px}
  .kz-cat-top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0 14px}
  .kz-cat-brand{font-weight:800;font-size:1.25rem;text-decoration:none;color:var(--kz-text,#f1f0fa)}
  .kz-cat-page h1{margin:6px 0 4px;font-size:1.6rem}
  .kz-cat-lead{margin:0 0 16px;color:var(--kz-muted,#a5a3c2)}
  .kz-catalog-footer{box-sizing:border-box;max-width:960px;margin:0 auto;padding:28px 16px;display:flex;flex-wrap:wrap;gap:8px 18px;font-size:.9rem}
</style>
</head>
<body>
<a class="kz-skip" href="#kz-catalog">Skip to games</a>
<div class="kz-cat-page">
  <div class="kz-cat-top"><a class="kz-cat-brand" href="/">KritZaar</a><a class="kz-btn kz-secondary" href="/library/">My Games</a></div>
  <h1>Game Catalog</h1>
  <p class="kz-cat-lead">Classic PC games that are free or legally available. Get each one from its official page, then play it in your browser. KritZaar hosts no game files.</p>
  <main id="kz-catalog"></main>
</div>
<noscript><p>The game catalog needs JavaScript to search. You can still open each game page directly.</p></noscript>
<footer class="kz-catalog-footer">
  <a href="/library/">My Games</a>
  <a href="/legal/how-it-works.html">How it works</a>
  <a href="/legal/terms.html">Terms</a>
  <a href="/legal/privacy.html">Privacy</a>
  <a href="/legal/dmca.html">Copyright / DMCA</a>
</footer>
<script type="module">
import { mountCatalogSearch } from '/js/search-ui.js';
mountCatalogSearch(document.getElementById('kz-catalog'), {});
</script>
<script type="module">import { initPwa } from '/js/pwa-install.js'; initPwa();</script>
</body>
</html>
